name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Nightly is needed only for rustfmt's unstable options (see .rustfmt.toml).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Stable is installed last, so it is the default toolchain for build/clippy/test.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git identity (for git-backed tests)
        run: |
          git config --global user.email ci@speccy.local
          git config --global user.name CI
      - name: Format
        run: cargo +nightly fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
