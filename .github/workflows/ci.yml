name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Nightly is needed only for rustfmt's unstable options (see .rustfmt.toml).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Stable is installed last, so it is the default toolchain for build/clippy/test.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Configure git identity (for git-backed tests)
        run: |
          git config --global user.email ci@speccy.local
          git config --global user.name CI
      - name: CI gate (fmt + clippy + test)
        run: just ci

  msrv:
    name: MSRV cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stable only bootstraps `cargo metadata`; the check runs on the MSRV
      # toolchain read from workspace Cargo metadata (single source of truth).
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MSRV toolchain from workspace metadata
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo "+$MSRV" check --workspace --all-targets --locked
